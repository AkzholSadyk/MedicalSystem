<form [formGroup]="profileForm" (ngSubmit)="save()">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>First Name</mat-label>
    <input matInput formControlName="first_name" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Last Name</mat-label>
    <input matInput formControlName="last_name" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Patronymic</mat-label>
    <input matInput formControlName="patronymic">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Gender</mat-label>
    <mat-select formControlName="gender">
      <mat-option value="male">Male</mat-option>
      <mat-option value="female">Female</mat-option>
      <mat-option value="other">Other</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Phone</mat-label>
    <input matInput formControlName="phone">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Date of birth</mat-label>
    <input matInput formControlName="date_of_birth" type="date">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>City</mat-label>
    <input matInput formControlName="city">
  </mat-form-field>

  <div *ngIf="isDoctor">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Clinic</mat-label>
      <mat-select formControlName="clinic_name">
        <mat-option *ngFor="let c of clinics" [value]="c">{{ c }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Specialization</mat-label>
      <mat-select formControlName="specialization">
        <mat-option *ngFor="let s of specializations" [value]="s">{{ s }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Department</mat-label>
      <mat-select formControlName="department_name">
        <mat-option *ngFor="let d of departments" [value]="d">{{ d }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div class="profile-actions">
    <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid || loading">
      Save
    </button>

    <!-- Prominent add-face button placed in profile form -->
    <button mat-stroked-button color="accent" type="button" (click)="startFaceRegistration()">
      Добавить лицо
    </button>
  </div>
</form>

  <div class="webauthn-section">
    <p>Face ID (optional)</p>
    <button mat-stroked-button color="accent" (click)="onEnableFaceId()" [disabled]="webauthnLoading">
      <mat-icon>face</mat-icon>
      <span *ngIf="!webauthnEnabled">Enable Face ID</span>
      <span *ngIf="webauthnEnabled">Face ID enabled</span>
    </button>
    <div *ngIf="webauthnError" class="error-message">{{ webauthnError }}</div>
  </div>

  <div class="face-section">
    <p>Camera Face Login (demo)</p>
    <button mat-stroked-button color="primary" (click)="startFaceRegistration()">Enable Face Login</button>

    <div *ngIf="showCamera" class="camera-widget">
  <video id="profileVideo" #video autoplay muted playsinline width="320" height="240"></video>
      <canvas #canvas width="320" height="240" style="display:none"></canvas>
      <div>
        <button mat-raised-button color="accent" (click)="captureFace()">Capture Face</button>
        <button mat-button (click)="stopCamera()">Cancel</button>
      </div>
      <div *ngIf="faceMessage">{{ faceMessage }}</div>
    </div>
  </div>
