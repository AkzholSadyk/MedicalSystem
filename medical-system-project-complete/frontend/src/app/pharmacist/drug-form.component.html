<mat-card>
  <mat-card-title>{{ id ? 'Edit Medication' : 'Add Medication' }}</mat-card-title>
  <mat-card-content>
    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="name" />
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Generic Name</mat-label>
      <input matInput [(ngModel)]="generic_name" />
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Form</mat-label>
      <input matInput [(ngModel)]="form" />
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Description</mat-label>
      <textarea matInput rows="4" [(ngModel)]="description"></textarea>
    </mat-form-field>

    <div>
      <label>Image</label>
      <input type="file" (change)="onFileChange($event)" />
    </div>

    <div style="margin-top:16px">
      <button mat-raised-button color="primary" (click)="submit()">Save</button>
      <button mat-button (click)="router.navigate(['/pharmacist'])">Cancel</button>
    </div>
  </mat-card-content>
</mat-card>
